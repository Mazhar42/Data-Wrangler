services:
  - type: web
    name: cleansing-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cleansing-db
          property: connectionString

databases:
  - name: cleansing-db
    plan: free
