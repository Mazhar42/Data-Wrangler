version: '3.8'

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: cleansing_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cleansingdb
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      # Update this with your actual VPS IP or Domain
      - CORS_ORIGINS=http://localhost,http://localhost:80,${VITE_BACKEND_URL} 
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OLLAMA_API_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi3}
      # Google Auth (if used)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: cleansing_ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    container_name: cleansing_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: cleansing_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cleansingdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  ollama_data:
