version: '3.8'

services:
  backend:
    build: ./backend
    container_name: cleansing_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cleansingdb
      - SECRET_KEY=${SECRET_KEY:-supersecretkeychangeinproduction}
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://your-vps-ip
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434/api/chat}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_BACKEND_URL=http://localhost:8000
    container_name: cleansing_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: cleansing_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cleansingdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
